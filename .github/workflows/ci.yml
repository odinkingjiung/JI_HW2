name: Test and publish Docker image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/steam-live-players
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy on Windows runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: [self-hosted, Windows]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/steam-live-players:latest
      CONTAINER_NAME: steam-live-players
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        shell: powershell
        run: docker pull $env:IMAGE

      - name: Replace running container
        shell: powershell
        run: |
          $existing = docker ps -aq -f "name=^$env:CONTAINER_NAME`$"
          if ($existing) { docker rm --force $env:CONTAINER_NAME }
          docker run --detach --restart unless-stopped --name $env:CONTAINER_NAME --publish 8000:8000 $env:IMAGE

      - name: Verify FastAPI is responding
        shell: powershell
        run: |
          $healthy = $false
          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 5
            try {
              $response = Invoke-WebRequest -Uri 'http://localhost:8000/' -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch { }
          }
          if (-not $healthy) {
            docker logs $env:CONTAINER_NAME
            throw 'FastAPI container health check failed.'
          }
