<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steam Live Players</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <main class="container">
    <header><p class="eyebrow">STEAM LIVE DATA</p><h1>게임 동시접속자 현황</h1><p class="lead">Steam 공개 API로 주요 게임의 현재 접속자 수를 비교합니다.</p></header>
    <section class="toolbar"><button id="refresh">↻ 데이터 새로고침</button><span id="status">불러오는 중...</span></section>
    <form id="add-game" class="add-game"><input id="game-name" placeholder="게임 이름" required><input id="game-appid" type="number" min="1" placeholder="Steam App ID" required><button type="submit">게임 추가</button></form>
    <section id="cards" class="cards" aria-live="polite"></section>
    <section class="chart-panel"><h2>게임별 비교</h2><div id="chart" class="chart"></div></section>
    <p id="error" class="error" role="alert"></p>
    <footer>데이터 출처: Steam Web API · 조회 시점에 따라 수치가 달라질 수 있습니다.</footer>
  </main>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
